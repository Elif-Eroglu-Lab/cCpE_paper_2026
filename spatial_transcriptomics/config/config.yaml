# Aim: config file for spatial transcriptomics, 10dpci, veh vs cCpE
# See README.md for information on how to use.

datasets:
  vehccpe:
    metadata: "../data/metadata.xlsx"
    nsections: 6
    split_variable: "sample"
    ndims2check: 30 
    reduction: "pca"
    reduction2test: "integrated.cca" # for testdiff_dimred
    variables2regress: "NULL"
    ndims: 25
    RunUMAP_input: "integrated.cca"
    RunUMAP_output: "umap.cca"
    cluster_prefix: "cca"
    resolutions2test: ["cca_resolution_1"]
    resolution: "cca_resolution_1"
  # naive:
  #   metadata: "../data/metadata_naive_only.xlsx"
  #   nsections: 1
  #   ndims2check: 30 
  #   reduction: "pca"
  #   variables2regress: "NULL"
  #   ndims: 20
  #   RunUMAP_input: "pca"
  #   RunUMAP_output: "umap.pca"
  #   cluster_prefix: "pca"
  #   resolution: "placeholder"
  allsections:
    metadata: "../data/metadata_w_naive.xlsx"
    nsections: 6
    split_variable: "animal_readable"
    ndims2check: 30 
    reduction: "pca"
    reduction2test: "integrated.cca" # for testdiff_dimred
    variables2regress: "NULL"
    ndims: 35
    RunUMAP_input: "integrated.cca"
    RunUMAP_output: "umap.cca"
    cluster_prefix: "cca"
    resolutions2test: ["cca_resolution_1.8", "cca_resolution_1.6", "cca_resolution_1.4", "cca_resolution_0.2"]
    resolution: "cca_resolution_placeholder"


# Global parameters (regardless of analysis)
nFeature_threshold: 200
nCount_threshold: 20000
min_cells: 3

