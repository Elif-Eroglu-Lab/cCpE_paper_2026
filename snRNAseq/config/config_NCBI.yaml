# Aim: config file for samples aligned to Pw NCBI genome
samples:
    PM_naive: results/01b_CellBenderoutput_Seurat/14dpci_filtered_seurat.h5
    Early_active: results/01b_CellBenderoutput_Seurat/14dpSham_filtered_seurat.h5
    14dpci: results/01b_CellBenderoutput_Seurat/Early_active_filtered_seurat.h5
    14dpsham: results/01b_CellBenderoutput_Seurat/PM_naive_filtered_seurat.h5
    10dpci_veh: results/01b_CellBenderoutput_Seurat/10dpci_veh_filtered_seurat.h5
    10dpci_cCpE: results/01b_CellBenderoutput_Seurat/10dpci_ccpe_filtered_seurat.h5

# Scrublet file (Rule 7b). Produced with Snakefile_cellbender
scrublet_csv:
    PM_naive: "results/01d_run_Scrublet/14dpci_scrubbed_metadata.csv"
    Early_active: "results/01d_run_Scrublet/14dpSham_scrubbed_metadata.csv"
    14dpci: "results/01d_run_Scrublet/Early_active_scrubbed_metadata.csv"
    14dpsham: "results/01d_run_Scrublet/PM_naive_scrubbed_metadata.csv"
    10dpci_veh: "results/01d_run_Scrublet/10dpci_veh_scrubbed_metadata.csv"
    10dpci_cCpE: "results/01d_run_Scrublet/10dpci_ccpe_scrubbed_metadata.csv"

nFeature_threshold: 200
nCount_threshold: 50000
min_cells: 3

ndims:
    PM_naive: 18
    Early_active: 24
    14dpci: 16
    14dpsham: 20
    10dpci_veh: 22
    10dpci_cCpE: 21

chosen_ndims:
    PM_naive: 18
    Early_active: 24
    14dpci: 16
    14dpsham: 16
    10dpci_veh: 22
    10dpci_cCpE: 21

resolution:
    PM_naive: ["0.7"]
    Early_active: ["1.4"]
    14dpci: ["0.7"]
    14dpsham: ["1.4"]
    10dpci_veh: ["0.3"]
    10dpci_cCpE: ["0.3"]

chosen_resolution:
    PM_naive: "resolution_0.7"
    Early_active: "resolution_1.4"
    14dpci: "resolution_0.7"
    14dpsham: "resolution_1.4"
    10dpci_veh: "resolution_0.3"
    10dpci_cCpE: "resolution_0.3"

integrations:
    # 10dpci:
    #     samples: ["10dpci_veh", "10dpci_cCpE"]
    megaminus:
        samples: ["PM_naive", "Early_active", "14dpci", "14dpsham", "10dpci_veh"]
    10dpci_ctrl:
        samples: ["10dpci_veh", "10dpci_cCpE", "14dpsham", "PM_naive"]
    miniatlas:
        samples: ["PM_naive", "14dpsham", "10dpci_veh", "14dpci"]

metadata_fields2merge: ["Doublet_Confidence", "nFeature_RNA", "nCount_RNA", "orig.ident", "scrublet_Scores", "scrublet_DropletType", "barcode"]

filter_modes:
    # - stringentDR
    # - conservativeDR
    # - noDR
    - DRscrub

filtering:
  DRscrub:
    exclude_categories: ["Doublet"]

# Rule 9: Normalize, Scale, PCA. Define variables to regress
variables2regress: 
    # 10dpci:
    #     DRscrub: "nCount_RNA"
    megaminus:
        DRscrub: ["nCount_RNA", "nFeature_RNA", "S.Score", "G2M.Score"]
    10dpci_ctrl:
        DRscrub: ["nCount_RNA", "nFeature_RNA", "S.Score", "G2M.Score"]
    miniatlas:
        DRscrub: ["nCount_RNA", "nFeature_RNA", "S.Score", "G2M.Score"]

# Rule 11b: integrated_dimred_diff & Rule 15b: peeled_integrated_dimred_diff
# Test dimensions for this/these integrations
test_int_method:
    # - "integrated.cca"
    # - "pca" # non-integrated version
    # - "integrated.rpca"
    - "integrated.harmony"

# # Rule 11b: integrated_dimred_diff & Rule 15b: peeled_integrated_dimred_diff
# Test dimensions above and below
ndims_integrated: "20"

integration_params:
    # 10dpci:
    #     DRscrub:
    #         RunUMAP_input: "pca"
    #         ndims: 20
    #         RunUMAP_output: "umap.pca"
    #         cluster_prefix: "pca"
    #         myclusters: "pca_resolution_1.2"
    megaminus:
        DRscrub:
            RunUMAP_input: "integrated.harmony"
            ndims: 35
            RunUMAP_output: "umap.harmony"
            cluster_prefix: "harmony"
            myclusters: "harmony_resolution_0.2"
    10dpci_ctrl:
        DRscrub:
            RunUMAP_input: "integrated.harmony"
            ndims: 25
            RunUMAP_output: "umap.harmony"
            cluster_prefix: "harmony"
            myclusters: "harmony_resolution_0.6"
    miniatlas:
        DRscrub:
            RunUMAP_input: "integrated.harmony"
            ndims: 20
            RunUMAP_output: "umap.harmony"
            cluster_prefix: "harmony"
            myclusters: "harmony_resolution_0.2"

# Rule 14: Peelout certain clusters for iterative reclustering
peelouts:
    megaminus:
        DRscrub:
            Epi: 
                clusters2peel: ["11", "04", "12"]
                RunUMAP_input: "integrated.harmony"
                ndims: 10
                RunUMAP_output: "umap_peeled.harmony"
                cluster_prefix: "harmony_peeled"
                myclusters: "harmony_peeled_resolution_1.6"
            Muscle: 
                clusters2peel: ["02", "08"]
                RunUMAP_input: "integrated.harmony"
                ndims: 10
                RunUMAP_output: "umap_peeled.harmony"
                cluster_prefix: "harmony_peeled"
                myclusters: "harmony_peeled_resolution_0.8"
            Stromal: 
                clusters2peel: ["01", "09", "07", "13", "05"]
                RunUMAP_input: "integrated.harmony"
                ndims: 10
                RunUMAP_output: "umap_peeled.harmony"
                cluster_prefix: "harmony_peeled"
                myclusters: "harmony_peeled_resolution_1.8"
            Devo: 
                clusters2peel: ["16"]
                RunUMAP_input: "integrated.harmony"
                ndims: 10
                RunUMAP_output: "umap_peeled.harmony"
                cluster_prefix: "harmony_peeled"
                myclusters: "harmony_peeled_resolution_1.2"
    miniatlas:
            DRscrub:
                Epi: 
                    clusters2peel: ["12"]
                    RunUMAP_input: "integrated.harmony"
                    ndims: 6
                    RunUMAP_output: "umap_peeled.harmony"
                    cluster_prefix: "harmony_peeled"
                    myclusters: "harmony_peeled_resolution_0.4"
    # 10dpci:
    #     DRscrub:
    #         Epi: 
    #             clusters2peel: ["19", "16", "21"]
    #             RunUMAP_input: "pca"
    #             ndims: 30
    #             RunUMAP_output: "umap_peeled.pca"
    #             cluster_prefix: "pca_peeled"
    #             myclusters: "myres"
    # 10dpci_ctrl:
    #     DRscrub:
    #         Epi:
    #             clusters2peel: ["16", "09", "26"]
    #             RunUMAP_input: "integrated.harmony"
    #             ndims: 15
    #             RunUMAP_output: "umap_peeled.harmony"
    #             cluster_prefix: "harmony_peeled"
    #             myclusters: "harmony_peeled_resolution_1"


