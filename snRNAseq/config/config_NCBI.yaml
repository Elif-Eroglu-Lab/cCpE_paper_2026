# README
# Description: config file for samples aligned to the Pleurodeles waltl NCBI genome. Used by Snakefile_NCBI.

# Note on sample names in the manuscript: Unoperated = PM_naive, Sham = 14dpsham, Veh = 10dpci_veh, cCpE = 10dpci_cCpE
# Most figures and panels are made outside of the Snakemake pipeline for finer control of aesthetics.

# Aim: To test and run snRNA-seq analysis including sample normalization, dimensionality reduction,
# clustering, doublet detection methods, merging, integration, subsetting, re-analysis of the subset, etc.

# First the samples are analysed individually, which also allows the usage of DoubletFinder. DoubletFinder & Scrublet were compared.
# Scrublet-detected doublets were removed, samples were merged and integrated.
# Epicardial clusters were subsetted for re-analysis.

# Prerequisites: Run config_cellbender.yaml first for ambient RNA removal and Scrublet-based doublet detection.
# That will produce the files needed here. 

# Author: Inika Prasad

samples:
    14dpsham: results/01b_CellBenderoutput_Seurat/14dpSham_filtered_seurat.h5
    PM_naive: results/01b_CellBenderoutput_Seurat/PM_naive_filtered_seurat.h5
    10dpci_veh: results/01b_CellBenderoutput_Seurat/10dpci_veh_filtered_seurat.h5
    10dpci_cCpE: results/01b_CellBenderoutput_Seurat/10dpci_ccpe_filtered_seurat.h5

# Scrublet file (Rule 7b). Produced with Snakefile_cellbender
scrublet_csv:
    14dpsham: "results/01d_run_Scrublet/14dpSham_scrubbed_metadata.csv"
    PM_naive: "results/01d_run_Scrublet/PM_naive_scrubbed_metadata.csv"
    10dpci_veh: "results/01d_run_Scrublet/10dpci_veh_scrubbed_metadata.csv"
    10dpci_cCpE: "results/01d_run_Scrublet/10dpci_ccpe_scrubbed_metadata.csv"

nFeature_threshold: 200
nCount_threshold: 50000
min_cells: 3

ndims:
    PM_naive: 18
    14dpsham: 20
    10dpci_veh: 22
    10dpci_cCpE: 21

chosen_ndims:
    PM_naive: 18
    14dpsham: 16
    10dpci_veh: 22
    10dpci_cCpE: 21

resolution:
    PM_naive: ["0.7"]
    14dpsham: ["1.4"]
    10dpci_veh: ["0.3"]
    10dpci_cCpE: ["0.3"]

chosen_resolution:
    PM_naive: "resolution_0.7"
    14dpsham: "resolution_1.4"
    10dpci_veh: "resolution_0.3"
    10dpci_cCpE: "resolution_0.3"

# Specify which samples should be merged. In our case, we will call the dataset 10dpci_ctrl (i.e. 10dpci with controls)
integrations:
    10dpci_ctrl:
        samples: ["10dpci_veh", "10dpci_cCpE", "14dpsham", "PM_naive"]

metadata_fields2merge: ["Doublet_Confidence", "nFeature_RNA", "nCount_RNA", "orig.ident", "scrublet_Scores", "scrublet_DropletType", "barcode"]

# Method of doublet detection. We tested both DoubletFinder and Scrublet, before we settled on Scrublet.
filter_modes:
    # - stringentDR
    # - conservativeDR
    # - noDR
    - DRscrub

# What category of cells to remove (doublet detectuion)
filtering:
  DRscrub:
    exclude_categories: ["Doublet"]

# Rule 9: Normalize, Scale, PCA. Define variables to regress
variables2regress: 
    10dpci_ctrl:
        DRscrub: ["nCount_RNA", "nFeature_RNA", "S.Score", "G2M.Score"]

# Rule 11b: integrated_dimred_diff & Rule 15b: peeled_integrated_dimred_diff
# Test dimensions for this/these integrations
test_int_method:
    # - "integrated.cca"
    # - "pca" # non-integrated version
    # - "integrated.rpca"
    - "integrated.harmony"

# # Rule 11b: integrated_dimred_diff & Rule 15b: peeled_integrated_dimred_diff
# Test dimensions above and below
ndims_integrated: "20"

# Integration of samples
integration_params:
    10dpci_ctrl:
        DRscrub:
            RunUMAP_input: "integrated.harmony"
            ndims: 25
            RunUMAP_output: "umap.harmony"
            cluster_prefix: "harmony"
            myclusters: "harmony_resolution_0.6"

# Rule 14: Subset certain clusters for iterative reclustering
peelouts:
    10dpci_ctrl:
        DRscrub:
            Epi:
                clusters2peel: ["16", "09", "26"]
                RunUMAP_input: "integrated.harmony"
                ndims: 15
                RunUMAP_output: "umap_peeled.harmony"
                cluster_prefix: "harmony_peeled"
                myclusters: "harmony_peeled_resolution_1"


###########################################################################################
# Rule DGE: Differential Gene Expression analysis
# Each analysis is named with a unique code like ALGOL
DGE_params:
  ALGOL:
    input_rds: "results/16_peeled_integrated_DimRed/10dpci_ctrl/10dpci_ctrl_DRscrub_Epi_dimred_CUSTOMRES.rds"
    clustering: "merged_clusters"
    reduction: "umap_peeled.harmony"
    ref: null
    tst: null
    grp: null
    ds: null
    tst_grp: "10dpci_cCpE"
    ref_grp: "10dpci_veh"
    grping: "orig.ident"
    clusterwise: "TRUE"
    covariates: "nFeature_RNA, nCount_RNA"
    test_use: "MAST"
    assay: "RNA"
  ALGORAB:
    input_rds: "results/16_peeled_integrated_DimRed/10dpci_ctrl/10dpci_ctrl_DRscrub_Epi_dimred_CUSTOMRES.rds"
    clustering: "merged_clusters"
    reduction: "umap_peeled.harmony"
    ref: null
    tst: null
    grp: null
    ds: null
    tst_grp: "10dpci_veh"
    ref_grp: "14dpsham"
    grping: "orig.ident"
    clusterwise: "TRUE"
    covariates: "nFeature_RNA, nCount_RNA"
    test_use: "MAST"
    assay: "RNA"
